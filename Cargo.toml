[workspace]
members = [
    "crates/rah-cli",
    "crates/rah-core",
    "crates/rah-model",
    "crates/rah-protocol",
    "crates/rah-runtime",
    "crates/rah-runtime-codex",
    "crates/rah-sandbox",
    "crates/rah-session",
    "crates/rah-tools",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.0"
tokio-util = "0.7"
uuid = { version = "1.0", features = ["serde", "v4"] }
