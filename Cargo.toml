[workspace]
members = [
    "crates/rah-api",
    "crates/rah-cli",
    "crates/rah-desktop",
    "crates/rah-kernel",
    "crates/rah-plugin-host-process",
    "crates/rah-plugin-host-wasm",
    "crates/rah-protocol",
    "plugins/context-compact",
    "plugins/context-default",
    "plugins/frontend-cli",
    "plugins/frontend-web",
    "plugins/loop-plan",
    "plugins/loop-react",
    "plugins/model-anthropic",
    "plugins/model-chat-completions",
    "plugins/model-mock",
    "plugins/model-responses",
    "plugins/policy-authority",
    "plugins/sandbox-process",
    "plugins/scheduler-basic",
    "plugins/session-jsonl",
    "plugins/session-titles",
    "plugins/skills-fs",
    "plugins/storage-fs",
    "plugins/telemetry-log",
    "plugins/tools-builtin",
    "plugins/tools-mcp",
    "plugins/tools-repo",
    "plugins/tools-repo-write",
    "plugins/tools-shell",
    "plugins/tools-web-search",
]
resolver = "3"

[workspace.package]
version = "0.44.0"
edition = "2024"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.0"
tokio-util = "0.7"
uuid = { version = "1.0", features = ["serde", "v4"] }
