[package]
name = "rah-runtime"
version.workspace = true
edition.workspace = true

[features]
# Diagnostic timing for ordinary host dispatch only.
live-test-support = ["rah-tools/live-test-support"]

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
futures.workspace = true
rah-model = { path = "../rah-model" }
rah-protocol = { path = "../rah-protocol" }
rah-tools = { path = "../rah-tools" }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
rah-sandbox = { path = "../rah-sandbox" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
