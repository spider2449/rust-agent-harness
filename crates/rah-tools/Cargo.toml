[package]
name = "rah-tools"
version.workspace = true
edition.workspace = true

[features]
# Opt-in fixture observability for the live Codex repository-patch example.
# This records only a process-local replacement-attempt counter and grants no
# additional tool, filesystem, or process authority.
live-test-support = []

[dependencies]
async-trait.workspace = true
futures.workspace = true
rah-protocol = { path = "../rah-protocol" }
rah-sandbox = { path = "../rah-sandbox" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
uuid.workspace = true

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
