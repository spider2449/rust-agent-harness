[package]
name = "rah-cli"
version.workspace = true
edition.workspace = true
description = "The `rah` distribution: reads rah.toml and mounts plugins into the kernel"

[[bin]]
name = "rah"
path = "src/main.rs"

[dependencies]
clap.workspace = true
rah-api = { path = "../rah-api" }
rah-plugin-host-process = { path = "../rah-plugin-host-process" }
rah-plugin-host-wasm = { path = "../rah-plugin-host-wasm" }
rah-plugin-context-compact = { path = "../../plugins/context-compact" }
rah-plugin-context-default = { path = "../../plugins/context-default" }
rah-plugin-format-on-write = { path = "../../plugins/format-on-write" }
rah-plugin-frontend-cli = { path = "../../plugins/frontend-cli" }
rah-plugin-frontend-web = { path = "../../plugins/frontend-web" }
rah-plugin-loop-plan = { path = "../../plugins/loop-plan" }
rah-plugin-loop-react = { path = "../../plugins/loop-react" }
rah-plugin-lsp-diagnostics = { path = "../../plugins/lsp-diagnostics" }
rah-plugin-model-anthropic = { path = "../../plugins/model-anthropic" }
rah-plugin-model-chat-completions = { path = "../../plugins/model-chat-completions" }
rah-plugin-model-mock = { path = "../../plugins/model-mock" }
rah-plugin-model-responses = { path = "../../plugins/model-responses" }
rah-plugin-policy-authority = { path = "../../plugins/policy-authority" }
rah-plugin-sandbox-process = { path = "../../plugins/sandbox-process" }
rah-plugin-scheduler-basic = { path = "../../plugins/scheduler-basic" }
rah-plugin-session-jsonl = { path = "../../plugins/session-jsonl" }
rah-plugin-session-titles = { path = "../../plugins/session-titles" }
rah-plugin-tool-input-repair = { path = "../../plugins/tool-input-repair" }
rah-plugin-skills-fs = { path = "../../plugins/skills-fs" }
rah-plugin-storage-fs = { path = "../../plugins/storage-fs" }
rah-plugin-telemetry-log = { path = "../../plugins/telemetry-log" }
rah-plugin-tools-builtin = { path = "../../plugins/tools-builtin" }
rah-plugin-tools-http = { path = "../../plugins/tools-http" }
rah-plugin-tools-mcp = { path = "../../plugins/tools-mcp" }
rah-plugin-tools-repo = { path = "../../plugins/tools-repo" }
rah-plugin-tools-repo-write = { path = "../../plugins/tools-repo-write" }
rah-plugin-tools-shell = { path = "../../plugins/tools-shell" }
rah-plugin-tools-web-search = { path = "../../plugins/tools-web-search" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
toml = "1"

[dev-dependencies]
futures.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
rah-protocol = { path = "../rah-protocol" }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "signal", "sync"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
