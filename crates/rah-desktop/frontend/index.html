<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAH</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main aria-labelledby="application-title">
      <section class="status-card">
        <p class="eyebrow">RAH</p>
        <h1 id="application-title">Rust Agent Harness</h1>
        <p id="frontend-boot-status">Desktop UI loading...</p>
        <p id="backend-error" class="backend-error" hidden>
          Desktop backend unavailable
        </p>
        <section aria-labelledby="application-status-title">
          <h2 id="application-status-title">Application</h2>
          <dl id="application-status"></dl>
        </section>
        <section aria-labelledby="runtime-status-title">
          <h2 id="runtime-status-title">Runtime</h2>
          <dl id="runtime-status"></dl>
          <p id="connection-error" class="connection-error" hidden></p>
          <button id="codex-connection" type="button">Connect Codex</button>
        </section>
        <section class="model" aria-labelledby="model-title">
          <h2 id="model-title">Model</h2>
          <p id="model-error" class="connection-error" hidden></p>
          <label for="model-provider">Model Provider</label>
          <select id="model-provider">
            <option value="inherit">Use Codex configuration</option>
            <option value="openai">OpenAI</option>
            <option value="ollama">Ollama</option>
            <option value="lm_studio">LM Studio</option>
            <option value="llama_cpp">llama.cpp</option>
          </select>
          <label for="model-identifier">Model</label>
          <input id="model-identifier" type="text" maxlength="256" />
          <p id="model-hint" class="model-hint"></p>
          <button id="apply-model-configuration" type="button">Apply Model Configuration</button>
        </section>
        <section class="repository" aria-labelledby="repository-title">
          <h2 id="repository-title">Repository</h2>
          <p id="repository-error" class="connection-error" hidden></p>
          <div class="repository-actions">
            <button id="choose-repository" type="button">Choose Repository</button>
            <button id="refresh-repository" type="button">Refresh</button>
          </div>
          <p id="repository-path">No repository selected</p>
          <h3>Status</h3>
          <div id="repository-status-entries" class="repository-entries"></div>
          <h3>Worktree Diff</h3>
          <div id="worktree-diff-entries" class="repository-diff"></div>
          <h3>Staged Diff</h3>
          <div id="staged-diff-entries" class="repository-diff"></div>
        </section>
        <section class="chat" aria-labelledby="chat-title">
          <h2 id="chat-title">Chat</h2>
          <p id="chat-hint">Connect Codex to chat</p>
          <p id="chat-error" class="connection-error" hidden></p>
          <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
          <form id="chat-form">
            <label class="visually-hidden" for="chat-prompt">Type a message</label>
            <textarea id="chat-prompt" rows="4" placeholder="Type a message..." disabled></textarea>
            <button id="chat-send" type="submit" disabled>Send</button>
          </form>
        </section>
        <section class="activity" aria-labelledby="activity-title">
          <h2 id="activity-title">Activity</h2>
          <div id="activity-entries" class="activity-entries" aria-live="polite"></div>
        </section>
      </section>
    </main>
    <script src="status.js"></script>
  </body>
</html>
