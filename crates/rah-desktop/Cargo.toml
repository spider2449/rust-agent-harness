[package]
name = "rah-desktop"
version.workspace = true
edition.workspace = true
build = "build.rs"

[target.'cfg(target_os = "windows")'.build-dependencies]
tauri-build = { version = "2" }

[target.'cfg(target_os = "windows")'.dependencies]
futures.workspace = true
rah-protocol = { path = "../rah-protocol" }
rah-runtime = { path = "../rah-runtime" }
rah-runtime-codex = { path = "../rah-runtime-codex" }
rah-tools = { path = "../rah-tools" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tokio = { workspace = true, features = ["macros", "sync", "test-util", "time"] }
tracing.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
