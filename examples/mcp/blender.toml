# Blender through the Blender Lab MCP server (https://www.blender.org/lab/mcp-server/).
#
#   RAH --(MCP over stdio)--> blender-mcp --(JSON + NUL over TCP :9876)--> Blender "MCP" add-on
#
# Port 9876 is the add-on's socket, not an MCP endpoint. RAH starts the
# Blender Lab server with `uvx`; that server connects to the add-on.
#
# Prerequisites: Blender 5.1+ with the Blender Lab "MCP" add-on enabled (it
# listens on localhost:9876), and `uv` on PATH.
#
# Run from the repository root:
#
#   cargo run -p rah-cli -- --config examples/mcp/blender.toml
#
# Note: the PyPI package `blender-mcp` is a different project with an
# incompatible add-on protocol. Install the server from the Blender Lab
# repository, pinned to a reviewed commit.
#
# See docs/MCP_SERVERS.md for the walkthrough and the safety notes.

# Mounted first. `mcp.blender.*` assigns `read`; the level each tool declares
# in `tools-mcp` below can only make it stricter, so `execute_blender_code`
# is still `execute` and asks on the terminal before every call.
[[plugin]]
use = "policy-authority"
config = { allow = ["none", "read"], ask = ["write", "execute"], tools = { echo = "none", "fs.read" = "read", "mcp.blender.*" = "read", "mcp.blender.execute_blender_code" = "execute" } }

[[plugin]]
use = "session-jsonl"
config = { dir = ".rah/sessions" }

[[plugin]]
use = "tools-builtin"
config = { root = "." }

# Process supervision, not an OS sandbox: the server and Blender keep
# network and filesystem access. The default inherited environment is enough
# for `uvx`.
[[plugin]]
use = "sandbox-process"
config = { root = "." }

# Only the tools listed here are exposed, as `mcp.blender.<name>`.
#
# Left out on purpose:
# - `*_for_cli`: start a background Blender process (needs BLENDER_PATH);
# - `get_screenshot_of_area_as_image`: only to keep the list short;
# - `render_*_to_path`: write to any `output_path`, outside the sandbox root.
#
# The first start downloads and builds the server, hence the long
# `startup_timeout_ms`.
[[plugin]]
use = "tools-mcp"
id = "mcp-blender"
config = { server = "blender", program = "uvx", args = ["--from", "git+https://projects.blender.org/lab/blender_mcp.git@dbbf836ad4b1025f14a2b3b504c43903f39e0b04#subdirectory=mcp", "blender-mcp"], env = { BLENDER_MCP_HOST = "localhost", BLENDER_MCP_PORT = "9876" }, startup_timeout_ms = 180000, call_timeout_ms = 120000, tools = { get_objects_summary = "read", get_object_detail_summary = "read", get_blendfile_summary_datablocks = "read", get_blendfile_summary_missing_files = "read", get_blendfile_summary_of_linked_libraries = "read", get_blendfile_summary_path_info = "read", get_blendfile_summary_usage_guess = "read", get_screenshot_of_window_as_json = "read", get_screenshot_of_window_as_image = "read", get_python_api_docs = "read", search_api_docs = "read", search_manual_docs = "read", jump_to_tab_by_name = "write", jump_to_tab_by_space_type = "write", jump_to_view3d_object_by_name = "write", jump_to_view3d_object_data_by_name = "write", execute_blender_code = "execute" } }

[[plugin]]
use = "context-default"
config = { memory_dir = ".rah/memory" }

# A local llama-server on http://127.0.0.1:8080, like the `default` preset;
# the plugin starts without it and fails on the first request instead. Swap
# for `model-anthropic` (ANTHROPIC_API_KEY) or `model-openai`, or for
# `model-mock` to run only explicit `/call <tool> <json>` prompts.
[[plugin]]
use = "model-llamacpp"

[[plugin]]
use = "loop-react"

[[plugin]]
use = "frontend-cli"
