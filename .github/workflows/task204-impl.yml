name: Task 204 implementation

on:
  push:
    branches:
      - task204-impl-20260904

permissions:
  contents: write

jobs:
  implement:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply Task 204 implementation
        run: python .github/task204_apply.py
      - name: Format implementation
        run: cargo fmt --all
      - name: Verify frontend syntax
        run: node --check crates/rah-desktop/frontend/status.js
      - name: Test Desktop on Windows
        run: cargo test -p rah-desktop
      - name: Lint Desktop on Windows
        run: cargo clippy -p rah-desktop --all-targets --all-features -- -D warnings
      - name: Verify diff and unchanged lockfile
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- Cargo.lock
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add desktop trusted profile selection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
