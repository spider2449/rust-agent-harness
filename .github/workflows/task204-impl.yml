name: Task 204 final Windows validation

on:
  push:
    branches:
      - task204-finalize-20260904
    paths:
      - .github/workflows/task204-impl.yml
      - .github/task204_baseline_fix.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply Task 204 implementation
        run: python .github/task204_apply.py
      - name: Apply Rust 1.98 baseline compatibility fix
        run: python .github/task204_baseline_fix.py
      - name: Format implementation
        run: cargo fmt --all
      - name: Verify frontend syntax
        run: node --check crates/rah-desktop/frontend/status.js
      - name: Test Desktop on Windows
        run: cargo test -p rah-desktop
      - name: Lint Desktop on Windows
        run: cargo clippy -p rah-desktop --all-targets --all-features -- -D warnings
      - name: Remove temporary validation scaffolding
        shell: bash
        run: rm -f .github/task204_baseline_fix.py task204-clippy.log
      - name: Verify diff and unchanged lockfile
        shell: bash
        run: |
          git diff --check
          git diff --exit-code origin/master -- Cargo.lock
          git diff --name-only origin/master
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: select provider-only trusted profiles in Desktop"
          git push origin "HEAD:${GITHUB_REF_NAME}"
