name: Task 204 clippy diagnostic

on:
  push:
    branches:
      - task204-impl-20260904

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.head_commit.message != 'chore: capture Task 204 clippy' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply Task 204 implementation
        run: python .github/task204_apply.py
      - name: Format implementation
        run: cargo fmt --all
      - name: Capture Desktop clippy output
        shell: bash
        run: |
          set +e
          cargo clippy -p rah-desktop --all-targets --all-features -- -D warnings > task204-clippy.log 2>&1
          status=$?
          cat task204-clippy.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add task204-clippy.log
            git commit -m "chore: capture Task 204 clippy"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit "$status"
