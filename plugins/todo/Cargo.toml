[package]
name = "rah-plugin-todo"
version.workspace = true
edition.workspace = true
description = "To-do plugin: a per-session task list the model keeps with `todo.write`, shown as a Web UI view"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
