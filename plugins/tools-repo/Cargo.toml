[package]
name = "rah-plugin-tools-repo"
version.workspace = true
edition.workspace = true
description = "Read-only Git repository tools (repo.status, repo.diff, repo.list, repo.search) over the `sandbox` service"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "process", "rt", "time"] }
