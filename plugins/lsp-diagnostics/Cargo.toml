[package]
name = "rah-plugin-lsp-diagnostics"
version.workspace = true
edition.workspace = true
description = "Appends language server diagnostics to the output of file-writing tools"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }

[dev-dependencies]
uuid.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
