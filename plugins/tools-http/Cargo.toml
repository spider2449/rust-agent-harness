[package]
name = "rah-plugin-tools-http"
version.workspace = true
edition.workspace = true
description = "Configured HTTP API tools: each tool is one declared endpoint of one internal API"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
