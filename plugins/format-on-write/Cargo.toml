[package]
name = "rah-plugin-format-on-write"
version.workspace = true
edition.workspace = true
description = "Runs the project's code formatter on files that write tools changed"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid.workspace = true
