[package]
name = "rah-plugin-session-jsonl"
version.workspace = true
edition.workspace = true
description = "Append-only JSONL session log plugin with fork and replay"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync"] }
