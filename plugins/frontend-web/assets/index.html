<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAH</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="bar">
    <strong class="brand">RAH</strong>
    <span id="guard" class="badge" hidden></span>
    <span id="connection" class="badge muted">connecting</span>
    <span class="spacer"></span>
    <button id="open-settings" type="button">Settings</button>
    <button id="toggle-plugins" type="button" class="ghost" title="Advanced: every plugin and its JSON configuration">Plugins</button>
  </header>

  <div id="approvals" class="approvals" aria-live="assertive"></div>

  <main class="layout">
    <nav class="sidebar" aria-label="Sessions">
      <button id="new-session" type="button">New session</button>
      <input id="session-search" type="search" placeholder="Search sessions" aria-label="Search sessions">
      <ul id="sessions" class="sessions"></ul>
    </nav>

    <section class="conversation" aria-label="Conversation">
      <div id="session-head" class="session-head" hidden>
        <h1 id="session-title" title="Double-click to rename"></h1>
        <span class="head-actions">
          <button id="session-rename" type="button" class="ghost">Rename</button>
          <button id="export-md" type="button" class="ghost" title="Download as Markdown">Export .md</button>
          <button id="export-json" type="button" class="ghost" title="Download as JSON">Export .json</button>
          <button id="session-delete" type="button" class="ghost danger">Delete</button>
        </span>
      </div>
      <div id="notice" class="notice" hidden></div>
      <ol id="transcript" class="transcript"></ol>
      <div id="live" class="live" hidden></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="3" placeholder="Message (Enter to send, Shift+Enter for a new line)" disabled></textarea>
        <div class="actions">
          <button id="send" type="submit" disabled>Send</button>
          <button id="cancel" type="button" class="ghost" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <aside id="plugins-panel" class="plugins" aria-label="Plugins" hidden>
      <div class="panel-head">
        <h2>Plugins</h2>
        <span>
          <button id="add-plugin" type="button" class="ghost">Add</button>
          <button id="refresh-plugins" type="button" class="ghost">Refresh</button>
        </span>
      </div>
      <form id="editor" class="editor" hidden>
        <h3 id="editor-title"></h3>
        <label id="editor-kind-row">Kind <select id="editor-kind"></select></label>
        <label id="editor-id-row">Id <input id="editor-id" placeholder="defaults to the kind"></label>
        <label>Configuration (JSON)
          <textarea id="editor-config" rows="6" spellcheck="false"></textarea>
        </label>
        <div class="buttons">
          <button id="editor-cancel" type="button" class="ghost">Cancel</button>
          <button id="editor-save" type="submit">Save</button>
        </div>
      </form>
      <table>
        <thead><tr><th>Plugin</th><th>State</th></tr></thead>
        <tbody id="plugins"></tbody>
      </table>
      <h2>Tools</h2>
      <ul id="tools" class="tools"></ul>
    </aside>
  </main>
  <footer id="status" class="status" aria-label="Status">
    <button id="status-root" type="button" class="item path link" title="Change the workspace folder"></button>
    <span id="status-git" class="item"></span>
    <span class="spacer"></span>
    <span id="status-model" class="item"></span>
    <span id="status-loop" class="item"></span>
    <span id="status-tools" class="item"></span>
    <span id="status-policy" class="item"></span>
  </footer>
  <dialog id="workspace-dialog" class="dialog" aria-labelledby="workspace-title">
    <h2 id="workspace-title">Workspace folder</h2>
    <p class="hint">File, Git and shell tools work inside this folder. Sessions are kept where they are.</p>
    <div class="path-row">
      <input id="ws-path" aria-label="Folder path" spellcheck="false">
      <button id="ws-go" type="button" class="ghost">Go</button>
    </div>
    <div class="ws-nav">
      <button id="ws-up" type="button" class="ghost">↑ Up</button>
      <span id="ws-roots"></span>
    </div>
    <div id="ws-error" class="notice" hidden></div>
    <div id="ws-recent-block" hidden>
      <h3>Recent</h3>
      <ul id="ws-recent" class="dirs"></ul>
    </div>
    <h3 id="ws-here"></h3>
    <ul id="ws-dirs" class="dirs"></ul>
    <div class="buttons">
      <button id="ws-cancel" type="button" class="ghost">Cancel</button>
      <button id="ws-use" type="button">Use this folder</button>
    </div>
  </dialog>
  <dialog id="settings-dialog" class="dialog settings" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title">Settings</h2>
      <button id="settings-close" type="button" class="ghost" aria-label="Close settings">Close</button>
    </div>
    <div id="settings-tabs" class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="model">Model</button>
      <button type="button" role="tab" data-tab="assistant">Assistant</button>
      <button type="button" role="tab" data-tab="tools">Tools</button>
      <button type="button" role="tab" data-tab="loop">Loop</button>
    </div>
    <div id="settings-message" class="settings-message" hidden></div>
    <div id="settings-body"></div>
  </dialog>
  <script src="/settings.js"></script>
  <script src="/app.js"></script>
</body>
</html>
