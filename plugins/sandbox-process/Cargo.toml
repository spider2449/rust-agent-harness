[package]
name = "rah-plugin-sandbox-process"
version.workspace = true
edition.workspace = true
description = "Sandbox plugins providing the `sandbox` service: `sandbox-process` (process supervision, not an OS sandbox) and `sandbox-os` (landlock and seccomp confinement on Linux)"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
serde.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "sync", "time"] }

# Process-tree termination: a Job Object on Windows, a process group on Unix.
# Linux confinement (`sandbox-os`): landlock and seccomp system calls.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "time"] }
