[package]
name = "rah-plugin-context-default"
version.workspace = true
edition.workspace = true
description = "Context plugin: system prompt, sliding history window and file-backed memory notes"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync"] }
