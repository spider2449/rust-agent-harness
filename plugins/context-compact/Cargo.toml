[package]
name = "rah-plugin-context-compact"
version.workspace = true
edition.workspace = true
description = "Context plugin: summarizes old conversation history with the model instead of dropping it"

[dependencies]
futures.workspace = true
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
