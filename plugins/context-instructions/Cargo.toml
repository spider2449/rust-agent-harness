[package]
name = "rah-plugin-context-instructions"
version.workspace = true
edition.workspace = true
description = "Context plugin: the workspace's instruction file (AGENTS.md) and configured text files for the model"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt"] }
