[package]
name = "rah-plugin-telemetry-log"
version.workspace = true
edition.workspace = true
description = "Telemetry plugin: records turn, model request and tool timings and token usage as JSONL"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
