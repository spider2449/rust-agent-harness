[package]
name = "rah-plugin-model-anthropic"
version.workspace = true
edition.workspace = true
description = "Anthropic Messages API model plugin: model-anthropic"

[dependencies]
async-stream.workspace = true
futures.workspace = true
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
