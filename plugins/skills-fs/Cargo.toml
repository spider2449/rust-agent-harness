[package]
name = "rah-plugin-skills-fs"
version.workspace = true
edition.workspace = true
description = "Skills from a directory: lists SKILL.md files to the model and loads them on demand"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
