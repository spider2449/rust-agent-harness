[package]
name = "rah-plugin-skills-fs"
version.workspace = true
edition.workspace = true
description = "Skills from a directory: lists SKILL.md files to the model and loads them on demand"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { workspace = true, features = ["fs", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
