[package]
name = "rah-plugin-tools-shell"
version.workspace = true
edition.workspace = true
description = "Opt-in shell.exec tool plugin: runs one program through the `sandbox` service"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
