[package]
name = "rah-plugin-tools-mcp"
version.workspace = true
edition.workspace = true
description = "MCP stdio client plugin: exposes host-listed tools of one MCP server, spawned through the `sandbox` service"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
