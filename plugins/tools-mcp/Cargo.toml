[package]
name = "rah-plugin-tools-mcp"
version.workspace = true
edition.workspace = true
description = "MCP client plugins: expose host-listed tools of one MCP server over stdio (spawned through the `sandbox` service) or Streamable HTTP"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
