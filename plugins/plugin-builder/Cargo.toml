[package]
name = "rah-plugin-plugin-builder"
version.workspace = true
edition.workspace = true
description = "Plugin builder: the model writes the user's personal process plugins from a description, checked against the plugin rules"

[dependencies]
rah-api = { path = "../../crates/rah-api" }
rah-protocol = { path = "../../crates/rah-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync"] }
